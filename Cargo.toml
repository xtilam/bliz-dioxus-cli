[package]
name = "dioxus-cli"
version = { workspace = true }
authors = ["Jonathan Kelley"]
edition = "2021"
description = "CLI for building fullstack web, desktop, and mobile apps with a single codebase."
repository = "https://github.com/DioxusLabs/dioxus/"
license = "MIT OR Apache-2.0"
keywords = ["mobile", "gui", "cli", "dioxus", "wasm"]
rust-version = "1.82.0"

[dependencies]
dioxus-autofmt = { workspace = true }
dioxus-rsx-rosetta = { workspace = true }
dioxus-rsx = { workspace = true }
dioxus-rsx-hotreload = { workspace = true }
dioxus-html = { workspace = true, features = ["hot-reload-context"] }
dioxus-core = { workspace = true, features = ["serialize"] }
dioxus-core-types = { workspace = true }
dioxus-devtools-types = { workspace = true }
dioxus-cli-config = { workspace = true }
dioxus-dx-wire-format = { workspace = true }
wasm-split-cli = { workspace = true }
depinfo = { workspace = true }
subsecond-types = { workspace = true }
dioxus-cli-telemetry = { workspace =  true }
dioxus-component-manifest = { workspace = true }

bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "cargo"] }
convert_case = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
cargo_toml = { workspace = true, features = ["features"] }
futures-util = { workspace = true, features = ["async-await-macro"] }
notify = { workspace = true, features = ["serde"] }
html_parser = { workspace = true }
cargo_metadata = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
rayon = { workspace = true }
futures-channel = { workspace = true }
krates = { workspace = true }
regex = "1.11.1"
console = "0.16.0"
ctrlc = "3.4.7"

axum = { workspace = true, default-features = true, features = ["ws"] }
axum-server = { workspace = true, features = ["tls-rustls-no-provider"] }
axum-extra = { workspace = true, features = ["typed-header"] }
tower-http = { workspace = true, features = ["full"] }
owo-colors = { workspace = true, features = ["supports-colors"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = [
    "full",
    "extra-traits",
    "visit",
    "visit-mut",
] }

walkdir = { workspace = true }
dunce = { workspace = true }

# tools download
dirs = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "json"] }
tower = { workspace = true }
git2 = "0.20.2"

# path lookup
which = { version = "8.0.0" }

# plugin packages
open = { workspace = true }
cargo-generate = "=0.23.3"
toml_edit = "0.22.27"

# formatting
# syn = { workspace = true }
prettyplease = { workspace = true }

# Assets
lightningcss = { version = "1.0.0-alpha.67", features = ["browserslist", "into_owned"] }
grass = "0.13.4"
codemap = "0.1.3"
mozjpeg = { version = "0.10.13", default-features = false, features = ["parallel"] }
imagequant = "4.4.0"
png = "0.17.16"
brotli = "8.0.1"
ignore = "0.4.23"
const-serialize = { workspace = true, features = ["serde"] }
const-serialize-07 = { package = "const-serialize", version = "=0.7.2", features = ["serde"] }

tracing-subscriber = { workspace = true, features = [
    "std",
    "env-filter",
    "json",
    "registry",
    "fmt",
] }
console-subscriber = { version = "0.4.1", optional = true }
schemars = "0.8"
tracing = { workspace = true }
ansi-to-tui = { workspace = true }
ansi-to-html = { workspace = true }
path-absolutize = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
ratatui = { workspace = true, features = ["crossterm", "unstable"] }
shell-words = { workspace = true }

# disable `log` entirely since `walrus` uses it and is *much* slower with it enableda
log = { version = "0.4.27", features = ["max_level_off", "release_max_level_off"] }

# link intercept
tempfile = "3.19.1"
manganis = { workspace = true }
manganis-core = { workspace = true }
manganis-core-07 = { workspace = true }
target-lexicon = { version = "0.13.2", features = ["serde", "serde_support"] }

# Extracting data from an executable
object = { workspace = true, features = ["all"] }
tokio-util = { workspace = true, features = ["full"] }
itertools = { workspace = true }
throbber-widgets-tui = "0.8.0"
unicode-segmentation = "1.12.0"
handlebars = "6.3.2"
walrus = { workspace = true, features = ["parallel"] }
wasmparser = { workspace = true }

# bundler dependencies
icns = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
rpm = { workspace = true }
include_dir = "0.7.4"
flate2 = "1.1.2"
tar = "0.4.44"
dircpy = "0.3.19"
plist = "1.7.4"
backtrace = "0.3.74"
ar = "0.9.0"
pdb = "0.8.0"
self_update = { version = "0.42.0", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
self-replace = "1.5.0"
cargo-config2 = { workspace = true }
serde_json5 = "0.2.1"
fs2 = "0.4.3"
sentry-backtrace = "0.42.0"
nucleo = "0.5.0"

# 0.5.12 rust-version is too high
home = "=0.5.11"
clap_complete = { version = "4.5.65", features = ["unstable-dynamic"] }

[target.'cfg(target_env = "musl")'.dependencies]
git2 = { version = "0.20.2", features = ["vendored-libgit2"] }

[features]
default = []
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
no-downloads = []
disable-telemetry = []

[[bin]]
path = "src/main.rs"
name = "dx"

[dev-dependencies]
escargot = "0.5"
indoc = "2.0.6"
pretty_assertions = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dx-{ target }{ archive-suffix }"
pkg-fmt = "zip"

[package.metadata.docs.rs]
all-features = false

# This repository contains only the `packages/cli` subdirectory of the Dioxus
# monorepo. Define a local workspace root so the `workspace = true` entries above
# can resolve, and point every Dioxus-internal dependency at the upstream
# `v0.7.10` tag instead of the monorepo's `path` dependencies.
[workspace]
resolver = "2"

[workspace.package]
version = "0.7.10"

[workspace.dependencies]
# Dioxus internal crates: use the upstream git tag because this checkout only
# contains the CLI package.
dioxus-autofmt = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-rsx-rosetta = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-rsx = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-rsx-hotreload = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10", default-features = false }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-core-types = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-devtools-types = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-dx-wire-format = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-cli-telemetry = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
dioxus-component-manifest = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
wasm-split-cli = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
depinfo = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
subsecond-types = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
manganis = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
manganis-core = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
manganis-core-07 = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }
const-serialize = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.10" }

# Third-party crates: versions match the Dioxus v0.7.10 workspace.
ansi-to-html = "0.2.2"
ansi-to-tui = "7.0"
anyhow = "1.0.98"
axum = { version = "0.8.4", default-features = false }
axum-extra = "0.10.1"
axum-server = { version = "0.7.3", default-features = false }
bytes = "1.10.1"
cargo-config2 = "0.1.34"
cargo_metadata = "0.19.2"
cargo_toml = "0.22.3"
chrono = "0.4.39"
clap = "4.5.40"
convert_case = "0.8.0"
crossterm = "0.28.1"
dirs = "6.0.0"
dunce = "1.0.5"
futures-channel = "0.3.32"
futures-util = { version = "0.3.32", default-features = false }
html_parser = "0.7.0"
hyper = "1.6.0"
hyper-rustls = { version = "0.27.7", default-features = false, features = [
    "native-tokio",
    "http1",
    "http2",
    "tls12",
    "logging",
    "ring",
] }
hyper-util = "0.1.12"
icns = "0.4.0"
image = "0.25.6"
itertools = "0.14.0"
krates = "0.17.5"
md5 = "0.8.0"
notify = "8.1.0"
object = "0.37.1"
open = "5.3.2"
owo-colors = "4.2.2"
path-absolutize = "3.1"
pretty_assertions = "1"
prettyplease = { version = "0.2.35", features = ["verbatim"] }
proc-macro2 = "1.0.101"
ratatui = "0.29.0"
rayon = "1.10.0"
reqwest = { version = "0.12.28", default-features = false }
rpm = { version = "0.20.0", default-features = false, features = ["gzip-compression"] }
rustls = { version = "0.23.28", default-features = false, features = [
    "logging",
    "std",
    "tls12",
    "ring",
] }
serde = "1.0.225"
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
shell-words = "1.1.0"
syn = "2.0.104"
thiserror = "2.0.12"
tokio = "1.48"
tokio-stream = "0.1.17"
tokio-tungstenite = "0.28.0"
tokio-util = "0.7.15"
toml = "0.8.23"
tower = "0.5.2"
tower-http = "0.6.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }
uuid = "1.17.0"
walkdir = "2.5.0"
walrus = { version = "0.23.3", features = ["parallel"] }
wasmparser = "0.235.0"
zip = { version = "4", default-features = false, features = ["deflate"] }
