name: Build dx

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build dx with Nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix build .#default --print-build-logs

      - name: Verify
        run: ./result/bin/dx --version

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp -L result/bin/dx dist/dx-x86_64-linux
          chmod +x dist/dx-x86_64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dx-x86_64-linux
          path: dist/dx-x86_64-linux
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="dist/dx-x86_64-linux"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            prerelease=()
            case "$tag" in
              *-*) prerelease=(--prerelease) ;;
            esac
            gh release create "$tag" "$asset" \
              --title "$tag" \
              --generate-notes \
              "${prerelease[@]}"
          fi
